[roster.undeadcrone]
voice = "Gacrux"
notes = "An old Forsaken woman: a raspy crone, cackling and bitter. Natural pace."
fits = "undead female: old"

[roster.undeadfemalesharp]
voice = "Despina"
notes = "A Forsaken woman: sharp, brittle and haughty, a chill in every word. Quick delivery."
