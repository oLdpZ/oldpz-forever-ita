# --- elders and the young
[roster.elderman]
voice = "Sadaltager"
notes = "An elderly man: knowledgeable, a gentle crackle of age, unhurried but never slow."
fits = "elderly male"

[roster.elderwry]
voice = "Rasalgethi"
notes = "An elderly man: wry and grumpy, an old cough in the voice. Natural pace."
fits = "elderly male"

[roster.eldersage]
voice = "Iapetus"
notes = "An elderly man: wise and solemn, a deep voice worn by the years. Measured, not slow."
fits = "elderly male: elders, seers"

[roster.elderwoman]
voice = "Sulafat"
notes = "An elderly woman: warm and patient, a soft tremor of age, natural pace."
fits = "elderly female"

[roster.elderwomandry]
voice = "Gacrux"
notes = "An elderly woman: dry, shrewd and a little stern. Natural pace."
