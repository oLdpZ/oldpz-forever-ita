# --- creatures
[roster.creature]
voice = "Fenrir"
notes = "A creature that is not human: rough, growling, intense, barely held back. Punchy delivery."
fits = "beasts, demons, dragons, elementals, giants, constructs"

[roster.creaturebrute]
voice = "Schedar"
notes = "A huge brute: deep, slow-witted and booming, simple words. Natural pace."
fits = "giants, ogres, brutes"

[roster.creaturehiss]
voice = "Enceladus"
notes = "A strange creature: hissing, whispering and alien. Natural pace."
fits = "demons, spirits, naga"

# Cast rows, first match wins: `when` holds profile fields (core/casting: race, gender, age, archetype,
# role), each a value or a list of values; a creature gets one voice from `voices` and keeps it.

[[cast]]
name = "undead, female, elder"
when = { archetype = ["undead", "ghost"], gender = "female", age = "elder" }
voices = ["undeadcrone", "undeadfemalebitter"]

[[cast]]
name = "undead, female"
when = { archetype = ["undead", "ghost"], gender = "female" }
voices = ["undeadfemale", "undeadfemalesharp", "undeadfemalesoft", "undeadfemaleghost", "undeadfemaleproud",
    "undeadfemalebitter"]

[[cast]]
name = "undead, elder"
when = { archetype = ["undead", "ghost"], age = "elder" }
voices = ["undeadweary", "undeadcroak"]

[[cast]]
name = "undead, officer"
when = { archetype = ["undead", "ghost"], role = ["leader", "guard", "soldier"] }
voices = ["undeadstern", "undeadmale", "undeadwry", "undeaddeep", "undeadgrim", "undeadcroak"]

[[cast]]
name = "undead, scholar"
when = { archetype = ["undead", "ghost"], role = ["scholar", "mage", "priest"] }
voices = ["undeadsly", "undeadhollow", "undeadnoble", "undeadsepulchral", "undeadhiss"]

[[cast]]
name = "undead"
when = { archetype = ["undead", "ghost"] }
voices = ["undeadmale", "undeadhollow", "undeaddeep", "undeadwry", "undeadcackle", "undeadweary", "undeadhiss"]

[[cast]]
name = "creature"
when = { archetype = ["demon", "dragon", "elemental", "mechanical", "beast-kin", "giant"] }
voices = ["creature", "creaturebrute", "creaturehiss"]

[[cast]]
name = "elder, female"
when = { age = "elder", gender = "female" }
voices = ["elderwoman", "elderwomandry"]

[[cast]]
name = "elder"
when = { age = "elder" }
voices = ["elderman", "elderwry", "eldersage"]

[[cast]]
name = "young, female"
when = { age = ["child", "young"], gender = "female" }
voices = ["youngwoman", "youngwomanlively"]

[[cast]]
name = "young"
when = { age = ["child", "young"] }
voices = ["youngman", "youngmanshy"]

[[cast]]
name = "female"
when = { gender = "female" }
voices = ["femalefirm", "femalewarm", "femaleeasy", "femalesteady"]

[[cast]]
name = "soldier"
when = { role = ["soldier", "guard"] }
voices = ["malerough", "malefirm", "malecasual"]

[[cast]]
name = "merchant"
when = { role = ["merchant", "innkeeper"] }
voices = ["malesmooth", "malewarm"]

[[cast]]
name = "male"
when = { gender = ["male", "none"] }
voices = ["malefirm", "malewarm", "malecasual", "malebright"]
