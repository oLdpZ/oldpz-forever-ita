[[cast]]
name = "undead, female, elder"
when = { archetype = ["undead", "ghost"], gender = "female", age = "elder" }
voices = ["undeadcrone", "undeadfemalebitter"]

[[cast]]
name = "undead, female"
when = { archetype = ["undead", "ghost"], gender = "female" }
voices = ["undeadfemale", "undeadfemalesharp", "undeadfemalesoft", "undeadfemaleghost", "undeadfemaleproud",
    "undeadfemalebitter"]

[[cast]]
name = "undead, elder"
when = { archetype = ["undead", "ghost"], age = "elder" }
voices = ["undeadweary", "undeadcroak"]

[[cast]]
name = "undead, officer"
when = { archetype = ["undead", "ghost"], role = ["leader", "guard", "soldier"] }
voices = ["undeadstern", "undeadmale", "undeadwry", "undeaddeep", "undeadgrim", "undeadcroak"]

[[cast]]
name = "undead, scholar"
when = { archetype = ["undead", "ghost"], role = ["scholar", "mage", "priest"] }
voices = ["undeadsly", "undeadhollow", "undeadnoble", "undeadsepulchral", "undeadhiss"]

[[cast]]
name = "undead"
when = { archetype = ["undead", "ghost"] }
voices = ["undeadmale", "undeadhollow", "undeaddeep", "undeadwry", "undeadcackle", "undeadweary", "undeadhiss"]

[[cast]]
name = "creature"
when = { archetype = ["demon", "dragon", "elemental", "mechanical", "beast-kin", "giant"] }
voices = ["creature", "creaturebrute", "creaturehiss"]

[[cast]]
name = "elder, female"
