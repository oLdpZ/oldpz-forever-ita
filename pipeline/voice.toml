# Voice over: the voices we may use (the roster) and which kind of speaker each one reads (the cast rows).
# Every voice is one of the Gemini TTS prebuilt voices; `notes` is the director's note the prompt carries for
# it, in English only (Gemini reads Italian direction aloud: `wfj validate` refuses accented letters and
# common Italian words). One Gemini voice may appear in several roster entries with different notes: the
# direction changes age, pitch and timbre enough to make another character, so the 30 prebuilt voices give
# many more. A cast row lists several voices so that speakers of one kind do not all sound alike; a creature
# keeps the one it is given.
#
# To recast a kind of speaker, change the voices of its cast row and run `wfj voice cast`: a file's
# fingerprint holds its voice and notes, so only that row's lines are made again.

model = "gemini-3.8-flash-tts"

# the voice of a line no creature says (a quest an item or object starts), and of a book page whose author
# is not a known speaker
narrator = "narrator"
book_narrator = "booknarrator"
# who the two narrators are, for the prompt's audio profile line (a creature's comes from its profile); English
# only, like the notes
narrator_profile = "The narrator of a fantasy adventure, telling what the hero sees and does"
book_narrator_profile = "Someone reading aloud an old book, a letter or a sign in a fantasy world"

# Words the voice says wrong, written as it must say them: only what is read aloud changes (`voice.respell`,
# whole words, case as written), never the Italian on screen; a line with such a word is made again.
[pronounce]
Lich = "Litch"   # Re dei Lich: read as in English, with a soft ch, not "lik"
lich = "litch"

# One table per voice: voice (the Gemini voice name), notes (how it reads), fits (what it is for).
# Every note asks for a natural, lively pace: the first audition sounded too slow.

